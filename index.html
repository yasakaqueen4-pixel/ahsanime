<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10091f">
<title>AHSANIME PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#10091f;color:white;font-family:Arial,sans-serif}
header{background:#1d1030;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:bold;color:#c17aff}
button{cursor:pointer;border:0;border-radius:7px;padding:11px;background:#933ee0;color:white;font-weight:bold}
input,textarea{width:100%;padding:12px;margin:7px 0 14px;background:#241735;border:1px solid #604078;border-radius:7px;color:white}
label{font-size:13px;color:#d5b9ed}
.hero{padding:45px 6%;background:linear-gradient(110deg,#210e38,#552477,#160c29)}
.hero h1{font-size:34px;margin-bottom:10px}
.wrap{padding:25px 5%}
.tools{display:flex;gap:10px;margin:18px 0}
.tools input{margin:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.card{background:#211532;border-radius:10px;overflow:hidden;border:1px solid #3b2850}
.card img{width:100%;height:230px;object-fit:cover}
.info{padding:11px}
.info h3{font-size:14px;margin-bottom:10px}
.info button{width:100%}
.admin,.player{display:none;position:fixed;inset:0;background:#000e;z-index:10;overflow:auto;padding:18px}
.panel{max-width:650px;margin:30px auto;background:#211532;border:1px solid #74429a;border-radius:12px;padding:20px}
.panel h2{margin-bottom:18px;color:#ce9aff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.close{background:#555}
video{width:100%;background:black;margin-top:15px;max-height:65vh}
.muted{color:#c3b0d3;line-height:1.6}
footer{text-align:center;padding:25px;color:#bda8d0}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card img{height:205px}.hero h1{font-size:27px}.tools{flex-direction:column}}
</style>
</head>
<body>

<header>
 <div class="logo">AHSANIME PRO</div>
 <button onclick="openAdmin()">ADMIN</button>
</header>

<section class="hero">
 <h1>Welcome to AHSANIME</h1>
 <p>Discover and watch your favourite anime.</p>
</section>

<main class="wrap">
 <h2>Anime Collection</h2>
 <div class="tools">
  <input id="search" placeholder="Search anime..." oninput="render()">
 </div>
 <div class="grid" id="grid"></div>
 <p id="empty" class="muted" style="padding:20px;display:none">No anime added yet.</p>
</main>

<footer>AHSANIME PRO · Anime discovery</footer>

<!-- ADMIN -->
<div class="admin" id="admin">
 <div class="panel">
  <button class="close" onclick="closeAdmin()">CLOSE ✕</button>
  <h2>Admin Dashboard</h2>
  <div id="login">
   <p class="muted">Enter demo admin password</p>
   <input id="password" type="password" placeholder="Admin password">
   <button onclick="login()">LOGIN</button>
   <p id="loginError" class="muted"></p>
  </div>

  <div id="dashboard" style="display:none">
   <h3 id="formTitle">Add New Anime</h3>
   <form id="animeForm">
    <input type="hidden" id="editId">
    <label>Anime Name</label>
    <input id="name" required placeholder="Anime name">

    <label>Poster Image URL</label>
    <input id="poster" type="url" required placeholder="https://image-link.jpg">

    <label>Description</label>
    <textarea id="description" rows="3" placeholder="Anime story"></textarea>

    <label>Episode Name</label>
    <input id="episode" placeholder="Episode 1">

    <label>Licensed HLS Stream URL (.m3u8)</label>
    <input id="stream" type="url" placeholder="https://your-provider.com/video.m3u8">

    <button type="submit">SAVE ANIME</button>
    <button type="button" class="close" onclick="resetForm()">CLEAR</button>
   </form>
   <hr style="margin:20px 0;border-color:#49335c">
   <h3>Manage Anime</h3>
   <div id="manage"></div>
   <button style="margin-top:20px" onclick="logout()">LOG OUT</button>
  </div>
 </div>
</div>

<!-- VIDEO PLAYER -->
<div class="player" id="player">
 <div class="panel">
  <button class="close" onclick="closePlayer()">CLOSE ✕</button>
  <h2 id="videoTitle">Anime Player</h2>
  <p id="videoEpisode" class="muted"></p>
  <video id="video" controls playsinline></video>
  <p id="videoMessage" class="muted"></p>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const KEY="ahsanime_anime_v1";
const DEMO_PASSWORD="ahsadmin123";
let animeList=[];
let hls=null;

function load(){
 try{
  animeList=JSON.parse(localStorage.getItem(KEY)||"[]");
  if(!Array.isArray(animeList))animeList=[];
 }catch(e){animeList=[]}
 render();
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(animeList));
 render();
 manage();
}

function safe(s){
 return String(s||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 const filtered=animeList.filter(a=>a.name.toLowerCase().includes(q));
 document.getElementById("empty").style.display=filtered.length?"none":"block";

 filtered.forEach(a=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   <img src="${safe(a.poster)}" alt="${safe(a.name)}" loading="lazy">
   <div class="info">
    <h3>${safe(a.name)}</h3>
    <button>▶ WATCH NOW</button>
   </div>`;
  card.querySelector("button").onclick=()=>playAnime(a.id);
  grid.appendChild(card);
 });
}

function openAdmin(){
 document.getElementById("admin").style.display="block";
}

function closeAdmin(){
 document.getElementById("admin").style.display="none";
}

function login(){
 if(document.getElementById("password").value===DEMO_PASSWORD){
  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
  manage();
 }else{
  document.getElementById("loginError").textContent="Wrong password!";
 }
}

function logout(){
 document.getElementById("dashboard").style.display="none";
 document.getElementById("login").style.display="block";
 document.getElementById("password").value="";
}

function resetForm(){
 document.getElementById("animeForm").reset();
 document.getElementById("editId").value="";
 document.getElementById("formTitle").textContent="Add New Anime";
}

document.getElementById("animeForm").onsubmit=function(e){
 e.preventDefault();
 const id=document.getElementById("editId").value;
 const item={
  id:id||String(Date.now()),
  name:document.getElementById("name").value.trim(),
  poster:document.getElementById("poster").value.trim(),
  description:document.getElementById("description").value.trim(),
  episode:document.getElementById("episode").value.trim(),
  stream:document.getElementById("stream").value.trim()
 };
 if(!/^https:\/\//i.test(item.poster)){
  alert("Poster must use HTTPS");return;
 }
 if(item.stream && !/^https:\/\//i.test(item.stream)){
  alert("Stream must use HTTPS");return;
 }
 if(id){
  animeList=animeList.map(a=>a.id===id?item:a);
 }else{
  animeList.unshift(item);
 }
 save();
 resetForm();
 alert("Anime saved!");
};

function manage(){
 const box=document.getElementById("manage");
 box.innerHTML="";
 animeList.forEach(a=>{
  const row=document.createElement("div");
  row.style.cssText="padding:12px 0;border-bottom:1px solid #49335c";
  row.innerHTML=`
   <b>${safe(a.name)}</b>
   <div class="actions">
    <button class="edit">EDIT</button>
    <button class="delete" style="background:#a83248">DELETE</button>
   </div>`;
  row.querySelector(".edit").onclick=()=>editAnime(a.id);
  row.querySelector(".delete").onclick=()=>deleteAnime(a.id);
  box.appendChild(row);
 });
}

function editAnime(id){
 const a=animeList.find(x=>x.id===id);
 if(!a)return;
 document.getElementById("editId").value=a.id;
 document.getElementById("name").value=a.name;
 document.getElementById("poster").value=a.poster;
 document.getElementById("description").value=a.description;
 document.getElementById("episode").value=a.episode;
 document.getElementById("stream").value=a.stream;
 document.getElementById("formTitle").textContent="Edit Anime";
 window.scrollTo(0,0);
}

function deleteAnime(id){
 if(!confirm("Delete this anime?"))return;
 animeList=animeList.filter(a=>a.id!==id);
 save();
}

function playAnime(id){
 const a=animeList.find(x=>x.id===id);
 if(!a)return;
 document.getElementById("player").style.display="block";
 document.getElementById("videoTitle").textContent=a.name;
 document.getElementById("videoEpisode").textContent=a.episode||"Episode";
 document.getElementById("videoMessage").textContent=a.description||"";
 const video=document.getElementById("video");
 stopStream();
 if(!a.stream){
  document.getElementById("videoMessage").textContent="No licensed episode stream added yet.";
  return;
 }
 if(!/^https:\/\//i.test(a.stream)){
  document.getElementById("videoMessage").textContent="Invalid secure stream URL.";
  return;
 }
 if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=a.stream;
 }else if(window.Hls && Hls.isSupported()){
  hls=new Hls();
  hls.loadSource(a.stream);
  hls.attachMedia(video);
  hls.on(Hls.Events.ERROR,(event,data)=>{
   if(data.fatal)document.getElementById("videoMessage").textContent="Stream error. Check provider URL and access.";
  });
 }else{
  document.getElementById("videoMessage").textContent="This browser cannot play this HLS stream.";
 }
}

function stopStream(){
 const video=document.getElementById("video");
 video.pause();
 video.removeAttribute("src");
 video.load();
 if(hls){hls.destroy();hls=null}
}

function closePlayer(){
 stopStream();
 document.getElementById("player").style.display="none";
}

load();
</script>
</body>
</html>
