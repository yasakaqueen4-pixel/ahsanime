<section class="section" id="player">
  <h2 id="playerTitle">Anime Player</h2>

  <div class="playerBox">
    <video
      id="video"
      controls
      playsinline
      preload="metadata">
    </video>

    <div class="subtitle-wrapper">
      <button id="subtitleBtn" type="button">
        CC Subtitles ⚙
      </button>

      <div id="subtitleMenu" class="subtitle-menu" hidden>
        <button type="button" data-sub="ja">
          🇯🇵 Japanese Sub
        </button>

        <button type="button" data-sub="en">
          🇬🇧 English Sub
        </button>

        <button type="button" data-sub="hi">
          🇮🇳 Hindi Sub
        </button>

        <button type="button" data-sub="hi-Latn">
          🇮🇳 Hinglish (Roman)
        </button>

        <button type="button" data-sub="off">
          🚫 Subtitles Off
        </button>
      </div>
    </div>

    <p id="subtitleInfo" class="muted">
      Select subtitle language
    </p>
  </div>
</section>
